name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      # Installs nlr from its pinned public git tag + splink/igraph/pandas.
      - run: uv sync
      - name: Lint
        run: uv run ruff check src tests
      # The integration tests need a Postgres (the justfixwow dump) and skip
      # cleanly without PG* env, so CI runs the unit suite.
      - name: Test
        run: uv run pytest -q
