[project]
name = "beneficial-ownership-resolution"
version = "0.1.0.dev0"
description = "Reliability-typed beneficial-ownership resolution over NYC public records: false-split resolution (record linkage), a name-free deed veil-pierce, and beneficial owner groups — with a paired benchmark against Who Owns What."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Robert Flagg" }]
keywords = [
    "beneficial-ownership", "entity-resolution", "record-linkage",
    "algorithmic-accountability", "housing", "nyc", "acris", "hpd",
]

# The false-split (record-linkage) layer is the standalone, gold-validated
# nyc-landlord-resolution engine (nlr); this package builds the deed layer,
# the beneficial-owner-group community, the reliability typing, and the
# evaluation protocol on top of it. nlr is public → resolves over HTTPS.
dependencies = [
    "nyc-landlord-resolution @ git+https://github.com/bobflagg/nyc-landlord-resolution.git@v0.1.0",
    # Pinned to the exact resolution version that produced the published / knowledge-graph
    # owner-group partition: the model fit is seeded and deterministic within a splink version,
    # but borderline pairs near the 0.999 threshold can differ across patch releases, so an
    # unpinned splink drifts a handful of groups. Pin for byte-reproducible results.
    "splink==4.0.16",
    "pandas>=2.0",
    "networkx>=3.0",       # off-graph connected components for owner groups (no Neo4j)
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.0",
    # duckdb comes transitively via nlr; made explicit in v1.1 for the public-CSV path
]

[project.optional-dependencies]
# v1.1 — the operational-nexus layer (WCC + Louvain over name/address/splink,
# aggregator-masked). Off-graph community detection, no Neo4j/GDS.
operational = [
    "python-louvain>=0.16",
    "igraph>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# nlr is pinned by git URL (a "direct reference"); hatchling needs this opt-in.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/bor"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
